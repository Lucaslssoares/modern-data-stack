# Cluster local: kind create cluster --name devops --config helm/kind-config.yaml
# Expõe o NodePort 30080 do cluster em http://localhost:30080
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
